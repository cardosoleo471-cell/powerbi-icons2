<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer pulsing glow -->
  <circle cx="32" cy="32" r="18" fill="url(#pulseGradient)">
    <animate attributeName="r"
             values="10;22;10"
             dur="1.6s"
             repeatCount="indefinite" />
    <animate attributeName="opacity"
             values="0.2;0.6;0.2"
             dur="1.6s"
             repeatCount="indefinite" />
  </circle>

  <!-- Solid center dot -->
  <circle cx="32" cy="32" r="6" fill="#E74C3C" stroke="#FFFFFF" stroke-width="2"/>
</svg>
